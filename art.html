<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Paintings by Maryam Tazrakine.">
    <title>Art — Maryam Tazrakine</title>
    <style>
        :root {
            --cream: #f4efe6;
            --paper: #fbf8f3;
            --brown: #3f332b;
            --muted: #75685d;
            --burgundy: #733f42;
            --border: #ded5ca;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { background: var(--cream); color: var(--brown); font-family: Arial, Helvetica, sans-serif; line-height: 1.6; }
        h1, h2 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; }
        a { color: inherit; text-decoration: none; }
        nav { width: 100%; padding: 28px 6%; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: Georgia, "Times New Roman", serif; font-size: 20px; letter-spacing: 3px; }
        .back-link { color: var(--muted); font-size: 12px; letter-spacing: 1px; text-transform: uppercase; transition: color .25s ease; }
        .back-link:hover { color: var(--burgundy); }
        main { padding: 70px 6% 110px; }
        .intro { max-width: 1100px; margin: 0 auto 48px; }
        .section-label { color: var(--burgundy); font-size: 11px; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 18px; }
        h1 { font-size: clamp(48px, 7vw, 76px); line-height: 1.05; margin-bottom: 18px; }
        .intro p { color: var(--muted); font-family: Georgia, "Times New Roman", serif; font-size: 20px; }
        .gallery { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; align-items: start; }
        .artwork { margin: 0; background: var(--paper); padding: 12px; border: 1px solid var(--border); }
        .artwork a { display: block; cursor: zoom-in; }
        .artwork img { display: block; width: 100%; height: auto; }
        footer { padding: 30px 6%; border-top: 1px solid var(--border); display: flex; justify-content: space-between; gap: 12px; font-size: 11px; color: var(--muted); letter-spacing: 1px; }
        @media (max-width: 700px) {
            nav { padding: 22px 5%; }
            main { padding: 48px 5% 80px; }
            .gallery { grid-template-columns: 1fr; gap: 22px; }
            .intro p { font-size: 18px; }
            footer { padding: 25px 5%; flex-direction: column; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">MARYAM</a>
        <a href="index.html#work" class="back-link">← Back to work</a>
    </nav>
    <main>
        <header class="intro">
            <div class="section-label">Selected Work</div>
            <h1>Art</h1>
            <p>A collection of paintings.</p>
        </header>
        <section class="gallery" aria-label="Paintings by Maryam Tazrakine">
            <figure class="artwork">
                <a href="painting-1.jpeg" target="_blank" rel="noopener" aria-label="View first painting full size">
                    <img src="painting-1.jpeg" alt="A colorful night scene with a small house beneath a crescent moon, surrounded by grass and flowers." loading="lazy">
                </a>
            </figure>
            <figure class="artwork">
                <a href="painting-2.jpeg" target="_blank" rel="noopener" aria-label="View second painting full size">
                    <img src="painting-2.jpeg" alt="A colorful abstract painting made of irregular shapes outlined in black." loading="lazy">
                </a>
            </figure>
        </section>
    </main>
    <footer>
        <span>© 2026 Maryam Tazrakine</span>
        <span>Made with curiosity.</span>
    </footer>
</body>
</html>
